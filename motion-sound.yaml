media_source:
  - platform: audio_file
    id: local_audio_files

media_player:
  - platform: speaker_source
    id: motion_audio_player
    name: "Motion Sound Player"
    announcement_pipeline:
      speaker: max98357_speaker
      sources:
        - local_audio_files
      format: MP3
      sample_rate: 16000
      num_channels: 1

script:
  - id: play_startup_sequence
    mode: single
    then:
      - script.execute:
          id: play_cue
          url: "audio-file://${boot_sound}"
      - script.wait: play_cue
      - wait_until:
          condition:
            media_player.is_announcing:
              id: motion_audio_player
          timeout: 5s
      - wait_until:
          condition:
            media_player.is_idle:
              id: motion_audio_player
          timeout: 15s
      - logger.log: "Startup cue finished; running the arm and meow sequence"
      - script.execute: play_motion_sequence
  - id: mark_arm_segment
    parameters:
      end_name: string
    then:
      - lambda: |-
          const uint32_t elapsed = millis() - id(arm_segment_started_ms);
          ESP_LOGI("motion_sound", "Arm reached %s in %u ms", end_name.c_str(), static_cast<unsigned>(elapsed));
          id(arm_segment_started_ms) = millis();
  - id: play_cue
    mode: restart
    parameters:
      url: string
    then:
      - lambda: |-
          std::string name = url;
          const auto slash = name.rfind('/');
          if (slash != std::string::npos) {
            name = name.substr(slash + 1);
          }
          ESP_LOGI("motion_sound", "Playing %s", name.c_str());
      - media_player.play_media:
          id: motion_audio_player
          media_url: !lambda return url;
          announcement: true
  - id: start_arm_sweep
    mode: parallel
    then:
      - if:
          condition:
            lambda: return id(arm_busy);
          then:
            - logger.log: "Arm busy; skipping movement"
          else:
            - lambda: id(arm_busy) = true;
            - script.execute: sweep_servo
  - id: play_motion_sequence
    mode: parallel
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t window_ms = ${sound_burst_window_ms};
          const uint32_t min_interval_ms = ${sound_min_interval_ms};
          if (id(trigger_window_started_ms) == 0 || (now - id(trigger_window_started_ms)) >= window_ms) {
            if (id(sound_rate_limited)) {
              ESP_LOGI("motion_sound", "Sound rate limit cleared");
            }
            id(trigger_window_started_ms) = now;
            id(trigger_count) = 0;
            id(sound_rate_limited) = false;
          }
          id(trigger_count) = id(trigger_count) + 1;
          if (id(trigger_count) > ${sound_burst_limit} && !id(sound_rate_limited)) {
            id(sound_rate_limited) = true;
            ESP_LOGI("motion_sound", "Sound rate limited after %u triggers", static_cast<unsigned>(id(trigger_count)));
          }
          bool allow = !id(sound_muted);
          if (allow && id(sound_rate_limited)) {
            allow = id(last_meow_ms) == 0 || (now - id(last_meow_ms)) >= min_interval_ms;
          }
          id(allow_meow) = allow;
          if (!allow && !id(sound_muted)) {
            ESP_LOGI("motion_sound", "Skipping meow; rate limited");
          }
      - if:
          condition:
            lambda: return id(allow_meow);
          then:
            - script.execute: play_random_meow
      - script.execute: start_arm_sweep
  - id: toggle_sound_mute
    mode: single
    then:
      - lambda: |-
          id(sound_muted) = !id(sound_muted);
          ESP_LOGI("motion_sound", "Sound %s", id(sound_muted) ? "muted" : "unmuted");
      - if:
          condition:
            lambda: return id(sound_muted);
          then:
            - media_player.stop:
                id: motion_audio_player
            - delay: 50ms
            - script.execute:
                id: play_cue
                url: "audio-file://beep"
          else:
            - script.execute:
                id: play_cue
                url: "audio-file://three_beeps"
  - id: growl_wiggle
    mode: single
    then:
      - wait_until:
          condition:
            lambda: return !id(arm_busy);
      - lambda: id(arm_busy) = true;
      - media_player.stop:
          id: motion_audio_player
      - delay: 50ms
      - script.execute:
          id: play_cue
          url: "audio-file://growl"
      - script.execute: wiggle_arm
      - script.wait: wiggle_arm
  - id: play_random_meow
    mode: restart
    then:
      - script.execute:
          id: play_cue
          url: !lambda |-
            static const char *const MEOWS[] = {
              "audio-file://meow_youtube_04",
              "audio-file://meow_youtube_27",
              "audio-file://meow_kaggle_36_0",
              "audio-file://meow_kaggle_31_13",
              "audio-file://meow_kaggle_14_2",
              "audio-file://meow_kaggle_18_0",
              "audio-file://meow_kaggle_20_0",
              "audio-file://meow_kaggle_23_2",
              "audio-file://meow_kaggle_23_4",
              "audio-file://meow_kaggle_29_6",
              "audio-file://meow_kaggle_34_2",
              "audio-file://meow_kaggle_39_0",
              "audio-file://meow_kaggle_42_0",
              "audio-file://meow_kaggle_42_1",
              "audio-file://meow_kaggle_46_4",
              "audio-file://meow_kaggle_47_1",
              "audio-file://meow_kaggle_48_0",
              "audio-file://meow_kaggle_52_0",
              "audio-file://meow_kaggle_57_2",
              "audio-file://meow_kaggle_58_1",
              "audio-file://meow_youtube_dc_22",
              "audio-file://meow_youtube_dc_24",
              "audio-file://meow_youtube_dc_34",
              "audio-file://meow_youtube_dc_42",
              "audio-file://meow_youtube_dc_52",
              "audio-file://hola"
            };
            constexpr uint32_t meow_count = sizeof(MEOWS) / sizeof(MEOWS[0]);
            id(last_meow_ms) = millis();
            const uint32_t purr_weight = ${purr_ratio};
            const uint32_t pick = random_uint32() % (meow_count + purr_weight);
            if (pick < purr_weight) {
              return std::string("audio-file://purring");
            }
            return std::string(MEOWS[pick - purr_weight]);
  # Eases the arm between two levels. The duration is base_ms scaled by Arm Speed;
  # the position comes from elapsed time, so speed is not limited by the loop rate.
  - id: move_arm
    mode: single
    parameters:
      from_level: float
      to_level: float
      base_ms: int
      end_name: string
    then:
      - lambda: |-
          id(move_started_ms) = millis();
          id(move_duration_ms) = std::max<uint32_t>(1, static_cast<uint32_t>(base_ms * id(arm_speed_factor) + 0.5f));
      - while:
          condition:
            lambda: return millis() - id(move_started_ms) < id(move_duration_ms);
          then:
            - servo.write:
                id: cat_arm_servo
                level: !lambda |-
                  float progress = (millis() - id(move_started_ms)) / static_cast<float>(id(move_duration_ms));
                  if (progress > 1.0f) {
                    progress = 1.0f;
                  }
                  const float eased = progress * progress * (3.0f - 2.0f * progress);
                  return from_level + (to_level - from_level) * eased;
            - delay: 20ms
      - servo.write:
          id: cat_arm_servo
          level: !lambda return to_level;
      - script.execute:
          id: mark_arm_segment
          end_name: !lambda return end_name;
  # Only start via start_arm_sweep, which claims arm_busy.
  - id: sweep_servo
    mode: single
    then:
      - lambda: id(arm_segment_started_ms) = millis();
      - script.execute:
          id: move_arm
          from_level: 0.0
          to_level: 0.2222
          base_ms: ${sweep_segment_ms}
          end_name: "sweep front end"
      - script.wait: move_arm
      - script.execute:
          id: move_arm
          from_level: 0.2222
          to_level: -0.2222
          base_ms: ${sweep_segment_ms}
          end_name: "sweep back end"
      - script.wait: move_arm
      - script.execute:
          id: move_arm
          from_level: -0.2222
          to_level: 0.0
          base_ms: ${sweep_segment_ms}
          end_name: "sweep center"
      - script.wait: move_arm
      # Keep holding center; a detached arm drifts and snaps back on the next sweep.
      - lambda: id(arm_busy) = false;
  - id: wiggle_cycle
    mode: restart
    then:
      - script.execute:
          id: move_arm
          from_level: 0.0
          to_level: 0.074
          base_ms: ${wiggle_segment_ms}
          end_name: "wiggle positive end"
      - script.wait: move_arm
      - script.execute:
          id: move_arm
          from_level: 0.074
          to_level: 0.0
          base_ms: ${wiggle_segment_ms}
          end_name: "wiggle center"
      - script.wait: move_arm
      - script.execute:
          id: move_arm
          from_level: 0.0
          to_level: -0.074
          base_ms: ${wiggle_segment_ms}
          end_name: "wiggle negative end"
      - script.wait: move_arm
      - script.execute:
          id: move_arm
          from_level: -0.074
          to_level: 0.0
          base_ms: ${wiggle_segment_ms}
          end_name: "wiggle center"
      - script.wait: move_arm
  - id: wiggle_arm
    mode: restart
    then:
      - script.stop: wiggle_cycle
      - lambda: id(arm_segment_started_ms) = millis();
      # script.execute returns immediately, so wait for each cycle to finish.
      - repeat:
          count: 4
          then:
            - script.execute: wiggle_cycle
            - script.wait: wiggle_cycle
      - lambda: id(arm_busy) = false;

binary_sensor:
  - platform: gpio
    id: motion_sensor
    name: "Motion"
    device_class: motion
    pin:
      number: ${motion_pin}
      mode:
        input: true
    on_press:
      then:
        - logger.log: "Motion detected"
        - script.execute: play_motion_sequence
  - platform: gpio
    id: control_button
    name: "Button"
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      - timing:
          - ON for at least 6s
        invalid_cooldown: 0s
        then:
          - logger.log: "Held 6 seconds; growl and wiggle"
          - script.execute: growl_wiggle
      - timing:
          - ON for 3s to 6s
          - OFF for at least 50ms
        invalid_cooldown: 0s
        then:
          - logger.log: "Released after 3 seconds; toggling sound mute"
          - script.execute: toggle_sound_mute
      - timing:
          - ON for 50ms to 3s
          - OFF for at least 50ms
        invalid_cooldown: 0s
        then:
          - logger.log: "Short press"
          - script.execute: play_motion_sequence

number:
  - platform: template
    id: arm_speed
    name: "Arm Speed"
    icon: mdi:speedometer
    min_value: 0
    max_value: 10
    step: 1
    initial_value: 7
    restore_value: true
    optimistic: true
    mode: slider
    on_value:
      - lambda: |-
          const float speed = std::isnan(x) ? 7.0f : x;
          // 0 matches the old speed 3 (2^0.8 = 1.74x longer); 10 is 8x faster than 5.
          id(arm_speed_factor) = speed <= 5.0f ? powf(1.7411f, (5.0f - speed) / 5.0f)
                                               : powf(0.125f, (speed - 5.0f) / 5.0f);
          ESP_LOGI("motion_sound", "Arm speed %.0f (duration x%.2f)", speed, id(arm_speed_factor));

switch:
  - platform: template
    id: mute_switch
    name: "Mute"
    icon: mdi:volume-off
    lambda: return id(sound_muted);
    turn_on_action:
      - if:
          condition:
            lambda: return !id(sound_muted);
          then:
            - script.execute: toggle_sound_mute
    turn_off_action:
      - if:
          condition:
            lambda: return id(sound_muted);
          then:
            - script.execute: toggle_sound_mute

button:
  - platform: template
    id: animate_arm_button
    name: "Animate Arm"
    on_press:
      - script.execute: start_arm_sweep
  - platform: template
    id: meow_button
    name: "Meow"
    on_press:
      - script.execute: play_random_meow
  - platform: template
    id: meow_and_arm_button
    name: "Meow and Arm"
    on_press:
      - script.execute: play_random_meow
      - script.execute: start_arm_sweep
  - platform: template
    id: hola_button
    name: "Hola"
    on_press:
      - script.execute:
          id: play_cue
          url: "audio-file://hola"
