# Behavior settings. Arm segment times are milliseconds at Arm Speed 5; the sound
# limiter times are milliseconds so the firmware can compare them with millis().
substitutions:
  # Printed once when startup finishes. Bump this when the flashed behavior changes.
  firmware_version: "0.1.17"

  # Duration of each beckon sweep segment (center-front, front-back, back-center)
  # at Arm Speed 5. Arm Speed 0 takes 1.74x longer; speed 10 is 8x faster.
  sweep_segment_ms: "2000"

  # Duration of each growl wiggle quarter at Arm Speed 5, scaled the same way.
  wiggle_segment_ms: "375"

  # Meows play on every trigger until this many triggers occur in one window.
  # The next trigger slows meows to sound_min_interval_ms. The arm still moves.
  # Button cues (beep, 3beeps, growl) are not counted or limited.
  sound_burst_limit: "40"

  # Trigger-counting window. A quiet gap this long restores a meow on every trigger.
  sound_burst_window_ms: "60000"

  # While the burst limit is exceeded, play at most one meow per this interval.
  sound_min_interval_ms: "30000"

  # How many times more often the purr is chosen than any one meow clip.
  # Each meow clip has weight 1. A ratio equal to the number of meows makes the
  # purr as common as all meows together. A ratio of 0 plays only meows.
  purr_ratio: "0"

  # Password of the fallback hotspot, which starts when the saved Wi-Fi network
  # cannot be reached. It must be at least 8 characters.
  fallback_ap_password: "GatoDoradoGrande"

  # Boot clip. "beep" plays the beep. "win_startup" plays the Windows startup sound.
  boot_sound: win_startup

  # Wiring. These are the GPIOs used below.
  servo_pin: GPIO13
  motion_pin: GPIO33
  button_pin: GPIO32
  i2s_lrclk_pin: GPIO22
  i2s_bclk_pin: GPIO19
  i2s_dout_pin: GPIO15

esphome:
  name: gato-dorado-2e90
  friendly_name: GatoDorado-2E90
  on_boot:
    priority: -100
    then:
      - logger.log: "Firmware version ${firmware_version}"
      # Attach and hold center now so the first sweep starts from a known position.
      - servo.write:
          id: cat_arm_servo
          level: 0
      - script.execute: play_startup_sequence

esp32:
  board: esp32dev
  partitions: partitions.csv
  framework:
    type: esp-idf

wifi:
  # When the saved network is unreachable for 1 minute, start a hotspot named
  # after the device. Join it from a phone or laptop; the captive portal opens a
  # page to choose a Wi-Fi network, and OTA and the API also work over it.
  ap:
    password: "${fallback_ap_password}"
    ap_timeout: 1min

captive_portal:

api:

ota:
  - platform: esphome

esp32_improv:
  authorizer: none

logger:
  logs:
    servo: WARN

i2s_audio:
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}

speaker:
  - platform: i2s_audio
    id: max98357_speaker
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    i2s_comm_fmt: stand_i2s

output:
  - platform: ledc
    id: servo_pwm
    pin: ${servo_pin}
    frequency: 50 Hz

servo:
  - id: cat_arm_servo
    output: servo_pwm
    min_level: 2.5%
    idle_level: 7.5%
    max_level: 12.5%

globals:
  - id: sound_muted
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: arm_segment_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: trigger_count
    type: uint16_t
    restore_value: no
    initial_value: "0"
  - id: trigger_window_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: sound_rate_limited
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_meow_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: allow_meow
    type: bool
    restore_value: no
    initial_value: "true"
  - id: move_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: move_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: "1"
  # Arm Speed multiplier for movement durations; 1.0 at speed 5.
  - id: arm_speed_factor
    type: float
    restore_value: no
    initial_value: "1.0"
  # Arm mutex: set while a sweep or wiggle owns the servo.
  - id: arm_busy
    type: bool
    restore_value: no
    initial_value: "false"

# These MP3 files are built by `make sounds`, embedded in firmware flash and
