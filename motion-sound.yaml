# Behavior settings. Times used by the arm are ESPHome durations; the sound
# limiter times are milliseconds so the firmware can compare them with millis().
substitutions:
  # Printed once when startup finishes. Bump this when the flashed behavior changes.
  firmware_version: "0.1.1"

  # Pause between arm positions during a beckon sweep.
  step_time: 25ms

  # Pause between arm positions during a growl wiggle, about 3× the sweep rate.
  wiggle_step_time: 8ms

  # Meows play on every trigger until this many triggers occur in one window.
  # The next trigger slows meows to sound_min_interval_ms. The arm still moves.
  # Button cues (beep, 3beeps, growl) are not counted or limited.
  sound_burst_limit: "4"

  # Trigger-counting window. A quiet gap this long restores a meow on every trigger.
  sound_burst_window_ms: "60000"

  # While the burst limit is exceeded, play at most one meow per this interval.
  sound_min_interval_ms: "30000"

  # How many times more often the purr is chosen than any one meow clip.
  # The four meows each have weight 1. A ratio of 4 makes the purr as common
  # as all four meows together. A ratio of 0 plays only meows.
  purr_ratio: "4"

  # Boot clip. "beep" plays beep.wav. "win_startup" plays win-startup.wav.
  boot_sound: win_startup

  # Wiring. These are the GPIOs used below.
  servo_pin: GPIO13
  motion_pin: GPIO33
  button_pin: GPIO32
  i2s_lrclk_pin: GPIO22
  i2s_bclk_pin: GPIO19
  i2s_dout_pin: GPIO15

esphome:
  name: motion-sound
  friendly_name: Motion Sound
  on_boot:
    priority: -100
    then:
      - logger.log: "Firmware version ${firmware_version}"
      - script.execute:
          id: play_cue
          url: "audio-file://${boot_sound}"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  logs:
    servo: WARN

i2s_audio:
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}

speaker:
  - platform: i2s_audio
    id: max98357_speaker
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    i2s_comm_fmt: stand_i2s

output:
  - platform: ledc
    id: servo_pwm
    pin: ${servo_pin}
    frequency: 50 Hz

servo:
  - id: cat_arm_servo
    output: servo_pwm
    min_level: 2.5%
    idle_level: 7.5%
    max_level: 12.5%

globals:
  - id: random_sound_index
    type: uint8_t
    restore_value: no
    initial_value: "0"
  - id: sound_muted
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: arm_segment_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: trigger_count
    type: uint16_t
    restore_value: no
    initial_value: "0"
  - id: trigger_window_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: sound_rate_limited
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_meow_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: allow_meow
    type: bool
    restore_value: no
    initial_value: "true"

# These WAV files are embedded in firmware flash and exposed via audio-file://.
audio_file:
  - id: meow_youtube_04
    file: .cache/sounds/meow_youtube_04.wav
  - id: meow_youtube_27
    file: .cache/sounds/meow_youtube_27.wav
  - id: meow_kaggle_36_0
    file: .cache/sounds/meow_kaggle_36_0.wav
  - id: meow_kaggle_31_13
    file: .cache/sounds/meow_kaggle_31_13.wav
  - id: beep
    file: .cache/sounds/beep.wav
  - id: three_beeps
    file: .cache/sounds/three_beeps.wav
  - id: win_startup
    file: .cache/sounds/win_startup.wav
  - id: growl
    file: .cache/sounds/growl.wav
  - id: purring
    file: .cache/sounds/purring.wav

media_source:
  - platform: audio_file
    id: local_audio_files

media_player:
  - platform: speaker_source
    id: motion_audio_player
    name: "Motion Sound Player"
    announcement_pipeline:
      speaker: max98357_speaker
      sources:
        - local_audio_files
      format: WAV
      sample_rate: 16000
      num_channels: 1

script:
  - id: mark_arm_segment
    parameters:
      end_name: string
    then:
      - lambda: |-
          const uint32_t elapsed = millis() - id(arm_segment_started_ms);
          ESP_LOGI("motion_sound", "Arm reached %s in %u ms", end_name.c_str(), static_cast<unsigned>(elapsed));
          id(arm_segment_started_ms) = millis();
  - id: play_cue
    mode: restart
    parameters:
      url: string
    then:
      - lambda: |-
          std::string name = url;
          const auto slash = name.rfind('/');
          if (slash != std::string::npos) {
            name = name.substr(slash + 1);
          }
          std::string file = name + ".wav";
          if (name == "three_beeps") {
            file = "3beeps.wav";
          } else if (name == "win_startup") {
            file = "win-startup.wav";
          }
          ESP_LOGI("motion_sound", "Playing %s", file.c_str());
      - media_player.play_media:
          id: motion_audio_player
          media_url: !lambda return url;
          announcement: true
  - id: play_motion_sequence
    mode: single
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t window_ms = ${sound_burst_window_ms};
          const uint32_t min_interval_ms = ${sound_min_interval_ms};
          if (id(trigger_window_started_ms) == 0 || (now - id(trigger_window_started_ms)) >= window_ms) {
            if (id(sound_rate_limited)) {
              ESP_LOGI("motion_sound", "Sound rate limit cleared");
            }
            id(trigger_window_started_ms) = now;
            id(trigger_count) = 0;
            id(sound_rate_limited) = false;
          }
          id(trigger_count) = id(trigger_count) + 1;
          if (id(trigger_count) > ${sound_burst_limit} && !id(sound_rate_limited)) {
            id(sound_rate_limited) = true;
            ESP_LOGI("motion_sound", "Sound rate limited after %u triggers", static_cast<unsigned>(id(trigger_count)));
          }
          bool allow = !id(sound_muted);
          if (allow && id(sound_rate_limited)) {
            allow = id(last_meow_ms) == 0 || (now - id(last_meow_ms)) >= min_interval_ms;
          }
          id(allow_meow) = allow;
          if (!allow && !id(sound_muted)) {
            ESP_LOGI("motion_sound", "Skipping meow; arm still moves");
          }
      - if:
          condition:
            lambda: return id(allow_meow);
          then:
            - script.execute: play_random_meow
      - script.execute: sweep_servo
  - id: toggle_sound_mute
    mode: single
    then:
      - lambda: |-
          id(sound_muted) = !id(sound_muted);
          ESP_LOGI("motion_sound", "Sound %s", id(sound_muted) ? "muted" : "unmuted");
      - if:
          condition:
            lambda: return id(sound_muted);
          then:
            - media_player.stop:
                id: motion_audio_player
            - delay: 50ms
            - script.execute:
                id: play_cue
                url: "audio-file://beep"
          else:
            - script.execute:
                id: play_cue
                url: "audio-file://three_beeps"
  - id: growl_wiggle
    mode: single
    then:
      - script.stop: sweep_servo
      - media_player.stop:
          id: motion_audio_player
      - delay: 50ms
      - script.execute:
          id: play_cue
          url: "audio-file://growl"
      - script.execute: wiggle_arm
  - id: play_random_meow
    mode: single
    then:
      - if:
          condition:
            and:
              - lambda: return !id(sound_muted);
              - media_player.is_idle:
                  id: motion_audio_player
          then:
            - lambda: |-
                id(last_meow_ms) = millis();
                const uint32_t purr_weight = ${purr_ratio};
                const uint32_t pick = random_uint32() % (4u + purr_weight);
                if (pick < purr_weight) {
                  id(random_sound_index) = 4;
                } else {
                  id(random_sound_index) = pick - purr_weight;
                }
            - if:
                condition:
                  lambda: return id(random_sound_index) == 0;
                then:
                  - script.execute:
                      id: play_cue
                      url: "audio-file://meow_youtube_04"
            - if:
                condition:
                  lambda: return id(random_sound_index) == 1;
                then:
                  - script.execute:
                      id: play_cue
                      url: "audio-file://meow_youtube_27"
            - if:
                condition:
                  lambda: return id(random_sound_index) == 2;
                then:
                  - script.execute:
                      id: play_cue
                      url: "audio-file://meow_kaggle_36_0"
            - if:
                condition:
                  lambda: return id(random_sound_index) == 3;
                then:
                  - script.execute:
                      id: play_cue
                      url: "audio-file://meow_kaggle_31_13"
            - if:
                condition:
                  lambda: return id(random_sound_index) == 4;
                then:
                  - script.execute:
                      id: play_cue
                      url: "audio-file://purring"
  - id: sweep_servo
    mode: single
    then:
      - lambda: id(arm_segment_started_ms) = millis();
      - repeat:
          count: 81
          then:
            - servo.write:
                id: cat_arm_servo
                level: !lambda |-
                  const float progress = iteration / 80.0f;
                  const float eased = progress * progress * (3.0f - 2.0f * progress);
                  return -0.2222f * eased;
            - delay: ${step_time}
      - script.execute:
          id: mark_arm_segment
          end_name: "sweep negative end"
      - repeat:
          count: 81
          then:
            - servo.write:
                id: cat_arm_servo
                level: !lambda |-
                  const float progress = iteration / 80.0f;
                  const float eased = progress * progress * (3.0f - 2.0f * progress);
                  return -0.2222f + 0.4444f * eased;
            - delay: ${step_time}
      - script.execute:
          id: mark_arm_segment
          end_name: "sweep positive end"
      - repeat:
          count: 81
          then:
            - servo.write:
                id: cat_arm_servo
                level: !lambda |-
                  const float progress = iteration / 80.0f;
                  const float eased = progress * progress * (3.0f - 2.0f * progress);
                  return 0.2222f - 0.4444f * eased;
            - delay: ${step_time}
      - script.execute:
          id: mark_arm_segment
          end_name: "sweep negative end"
      - repeat:
          count: 81
          then:
            - servo.write:
                id: cat_arm_servo
                level: !lambda |-
                  const float progress = iteration / 80.0f;
                  const float eased = progress * progress * (3.0f - 2.0f * progress);
                  return -0.2222f * (1.0f - eased);
            - delay: ${step_time}
      - script.execute:
          id: mark_arm_segment
          end_name: "sweep center"
      - delay: 300ms
      - servo.detach: cat_arm_servo
  - id: wiggle_cycle
    mode: restart
    then:
      - repeat:
          count: 15
          then:
            - servo.write:
                id: cat_arm_servo
                level: !lambda |-
                  const float progress = iteration / 14.0f;
                  const float eased = progress * progress * (3.0f - 2.0f * progress);
                  return 0.074f * eased;
            - delay: ${wiggle_step_time}
      - script.execute:
          id: mark_arm_segment
          end_name: "wiggle positive end"
      - repeat:
          count: 15
          then:
            - servo.write:
                id: cat_arm_servo
                level: !lambda |-
                  const float progress = iteration / 14.0f;
                  const float eased = progress * progress * (3.0f - 2.0f * progress);
                  return 0.074f * (1.0f - eased);
            - delay: ${wiggle_step_time}
      - script.execute:
          id: mark_arm_segment
          end_name: "wiggle center"
      - repeat:
          count: 15
          then:
            - servo.write:
                id: cat_arm_servo
                level: !lambda |-
                  const float progress = iteration / 14.0f;
                  const float eased = progress * progress * (3.0f - 2.0f * progress);
                  return -0.074f * eased;
            - delay: ${wiggle_step_time}
      - script.execute:
          id: mark_arm_segment
          end_name: "wiggle negative end"
      - repeat:
          count: 15
          then:
            - servo.write:
                id: cat_arm_servo
                level: !lambda |-
                  const float progress = iteration / 14.0f;
                  const float eased = progress * progress * (3.0f - 2.0f * progress);
                  return -0.074f * (1.0f - eased);
            - delay: ${wiggle_step_time}
      - script.execute:
          id: mark_arm_segment
          end_name: "wiggle center"
  - id: wiggle_arm
    mode: restart
    then:
      - script.stop: wiggle_cycle
      - lambda: id(arm_segment_started_ms) = millis();
      # script.execute returns immediately, so wait for each cycle to finish.
      - repeat:
          count: 4
          then:
            - script.execute: wiggle_cycle
            - script.wait: wiggle_cycle
      - delay: 100ms
      - servo.detach: cat_arm_servo

binary_sensor:
  - platform: gpio
    id: motion_sensor
    name: "Motion"
    device_class: motion
    pin:
      number: ${motion_pin}
      mode:
        input: true
    on_press:
      then:
        - logger.log: "Motion detected; choosing a random embedded meow"
        - script.execute: play_motion_sequence
  - platform: gpio
    id: control_button
    name: "Button"
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      - timing:
          - ON for at least 6s
        invalid_cooldown: 0s
        then:
          - logger.log: "Held 6 seconds; growl and wiggle"
          - script.execute: growl_wiggle
      - timing:
          - ON for 3s to 6s
          - OFF for at least 50ms
        invalid_cooldown: 0s
        then:
          - logger.log: "Released after 3 seconds; toggling sound mute"
          - script.execute: toggle_sound_mute
      - timing:
          - ON for 50ms to 3s
          - OFF for at least 50ms
        invalid_cooldown: 0s
        then:
          - logger.log: "Short press; playing sound and moving the arm"
          - script.execute: play_motion_sequence
