  - id: meow_kaggle_48_0
    file: .cache/sounds/meow_kaggle_48_0.mp3
  - id: meow_kaggle_52_0
    file: .cache/sounds/meow_kaggle_52_0.mp3
  - id: meow_kaggle_57_2
    file: .cache/sounds/meow_kaggle_57_2.mp3
  - id: meow_kaggle_58_1
    file: .cache/sounds/meow_kaggle_58_1.mp3
  - id: meow_youtube_dc_22
    file: .cache/sounds/meow_youtube_dc_22.mp3
  - id: meow_youtube_dc_24
    file: .cache/sounds/meow_youtube_dc_24.mp3
  - id: meow_youtube_dc_34
    file: .cache/sounds/meow_youtube_dc_34.mp3
  - id: meow_youtube_dc_42
    file: .cache/sounds/meow_youtube_dc_42.mp3
  - id: meow_youtube_dc_52
    file: .cache/sounds/meow_youtube_dc_52.mp3
  - id: beep
    file: .cache/sounds/beep.mp3
  - id: three_beeps
    file: .cache/sounds/three_beeps.mp3
  - id: win_startup
